[project]
name = "qualtrics-sync-analysis"
version = "0.1.0"
description = "A simple Python utility to explore sending data to Qualtrics, exporting results, and performing local analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
qualtrics-sync = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
